name: Cypress Tests with Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout gh-pages history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore Cypress binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Prepare Allure history
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d gh-pages/history ]; then
            cp -R gh-pages/history allure-results/history
          fi

      - name: Run Cypress tests in Chrome
        id: cypress
        continue-on-error: true
        run: npx cypress run --browser chrome

      - name: Generate Allure HTML report
        id: allure
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.allure.outcome == 'success'
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && steps.allure.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report

      - name: Fail job when Cypress tests failed
        if: always() && steps.cypress.outcome == 'failure'
        run: exit 1
